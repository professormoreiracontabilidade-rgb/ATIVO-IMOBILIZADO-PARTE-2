<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativo Imobilizado — Parte 2 | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#133b68;font:18px/1.6 system-ui,Arial}main{max-width:720px;margin:auto;padding:20px 18px 110px}h1{font-size:clamp(30px,7vw,46px);line-height:1.2}h2{font-size:27px;line-height:1.3}button,input,a.btn{font:inherit;border-radius:13px;padding:14px 16px}button,a.btn{cursor:pointer;background:#133b68;color:white;border:0;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:default}input{width:100%;border:1px solid #acc4d8;background:white;color:#133b68;margin:6px 0 12px}label{display:block;font-weight:650}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #143b6810;margin:16px 0}.tag{color:#007f87;font-size:13px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.btn{width:100%;text-align:center;margin:7px 0}.green{background:#007f87!important}.note{background:#e8f5f3;border-radius:14px;padding:18px}.text{white-space:pre-line}.meta{font-size:14px;color:#50657c}header{display:flex;justify-content:space-between;gap:10px;align-items:center}progress{width:100%;height:9px;accent-color:#007f87}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cfdeeb;padding:12px;display:flex;justify-content:center;gap:10px;z-index:5}nav button{min-width:65px}.option{display:block;width:100%;text-align:left;margin:10px 0;background:#f0f6fb;color:#133b68;border:2px solid transparent}.option.selected{border-color:#007f87;background:#e8f5f3}.correct{background:#d9f3e5;color:#14623a}.wrong{background:#ffe0e0;color:#9c2634}.feedback{padding:15px;border-radius:12px;font-weight:bold}.error{color:#b92b36;font-size:15px}footer{font-size:13px;text-align:center;margin-top:25px}a{color:#007f87}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #eaa12b;outline-offset:3px}</style></head><body><main id="app"></main><nav id="nav" hidden></nav><script>
const QUESTIONS=[{"n": 8, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "body": "Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril.\n \n\nNo Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de", "options": [{"letter": "A", "text": "janeiro."}, {"letter": "B", "text": "fevereiro."}, {"letter": "C", "text": "março."}, {"letter": "D", "text": "abril."}], "answer": "C", "resolution": "Assinatura em janeiro e pagamento em fevereiro não significam recebimento da\nmáquina. No cenário, ela foi entregue, instalada e disponibilizada em março.\nReconhecimento no imobilizado em março: alternativa C. O uso voluntariamente\nadiado até abril não altera essa referência."}, {"n": 9, "header": "FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2025", "body": "Uma empresa S.A. celebrou um contrato no valor de R$ 30.000,00 para utilizar um equipamento por um período de 10 meses, cujo ativo subjacente do contrato foi considerado de baixo valor pela empresa.\n\nA administração da empresa S.A. decidiu aplicar a isenção de reconhecimento autorizada pelo item 5 da NBC TG 06 (R3).\n \n\nConsiderando-se as informações apresentadas e os preceitos da NBC TG 06 (R3) – ARRENDAMENTOS, o tratamento contábil para esse contrato é", "options": [{"letter": "A", "text": "registrar o valor total do contrato antecipadamente como despesa no início do contrato."}, {"letter": "B", "text": "capitalizar o valor do contrato como ativo imobilizado, amortizando ao longo do contrato."}, {"letter": "C", "text": "reconhecer os pagamentos do arrendamento como despesa no resultado, de forma linear ou sistemática, ao longo do prazo do contrato."}, {"letter": "D", "text": "reconhecer um ativo de direito de uso e um passivo de arrendamento, ambos, ao valor presente estipulado no contrato."}], "answer": "C", "resolution": "Como a entidade optou pela isenção permitida, os pagamentos são reconhecidos como\ndespesa ao longo do contrato, em base linear ou outra base sistemática apropriada. Se\nlinear: 30.000 ÷ 10 = R$ 3.000 por mês. Não registrar todo o custo como despesa\ninicial nem reconhecer direito de uso/passivo nesse tratamento. Alternativa C."}, {"n": 10, "header": "FGV - ATM (Pref SJC)/Pref SJC/Gestão Tributária/2024", "body": "Em uma sociedade empresária, são classificados(as) como “Ativo Imobilizado em Andamento”", "options": [{"letter": "A", "text": "os melhoramentos e as obras integradas aos terrenos utilizados."}, {"letter": "B", "text": "os bens incorpóreos destinados à manutenção das atividades."}, {"letter": "C", "text": "as peças destinadas à substituição em máquinas e equipamentos."}, {"letter": "D", "text": "os bens utilizados para deslocamento de pessoal ou transporte de mercadorias."}, {"letter": "E", "text": "os bens em uso durante a fase pré-operacional, relativos ao desenvolvimento de um projeto."}], "answer": "E", "resolution": "Pelo gabarito do exercício, bens utilizados na fase pré-operacional vinculada ao\ndesenvolvimento de projeto compõem imobilizado em andamento: E. As demais\nopções descrevem melhoramentos, intangíveis, peças e bens de transporte. A\nclassificação de andamento precisa estar ligada ao projeto ainda não concluído.\nNão conclua que todo bem da fase pré-operacional está sem depreciação. Se um\ncomponente já estiver disponível para sua finalidade, examine separadamente o início\nda depreciação."}, {"n": 11, "header": "FGV - Cons Leg (CM SP)/CM SP/Contador/2024", "body": "Um restaurante adquiriu, por R$50.000, grades que foram instaladas ao redor de seu terreno por razão de segurança. A aquisição das grades não aumentou diretamente os benefícios econômicos futuros específicos do terreno, no entanto, foi considerada necessária para que o fluxo do atendimento aos clientes continuasse.\n \n\nAssinale a opção que indica a classificação contábil das grades nas demonstrações contábeis do restaurante, de acordo com as diretrizes dos pronunciamentos contábeis.", "options": [{"letter": "A", "text": "Ativo Imobilizado, no Balanço Patrimonial."}, {"letter": "B", "text": "Investimentos, no Balanço Patrimonial."}, {"letter": "C", "text": "Ativo Realizável a Longo Prazo, no Balanço Patrimonial."}, {"letter": "D", "text": "Despesa Operacional, na Demonstração do Resultado do Exercício."}, {"letter": "E", "text": "Outras Despesas Operacionais, na Demonstração do Resultado do Exercício."}], "answer": "A", "resolution": "As grades permitem continuar o atendimento em condições de segurança. Benefício\nindireto também sustenta reconhecimento como ativo. R$ 50.000 em imobilizado,\nalternativa A; não há exigência de aumento direto da receita de um bem específico."}, {"n": 12, "header": "FGV - Aud Est (CGE SC)/CGE SC/Ciências Contábeis/2023", "body": "Uma sociedade empresária deu início a obras para expansão de seu escritório. Estima-se que a obra tenha dois anos de duração, com início em 02/01/X0 e término em 31/12/X1.\n\n\nPara a obra, foram adquiridos R$40.000 em material de construção.\n\n\nAssinale a opção que indica a contabilização do material de construção no balanço patrimonial da sociedade empresária.", "options": [{"letter": "A", "text": "R$40.000 em ativo circulante."}, {"letter": "B", "text": "R$40.000 em ativo realizável a longo prazo."}, {"letter": "C", "text": "R$40.000 em investimentos."}, {"letter": "D", "text": "R$40.000 em ativo imobilizado."}, {"letter": "E", "text": "R$20.000 em ativo circulante e R$20.000 em ativo realizável a longo prazo."}], "answer": "D", "resolution": "R$ 40.000 em material destinado à expansão do próprio escritório integram o\nimobilizado em andamento. O prazo de dois anos da obra não transforma esse material\nem realizável a longo prazo. Alternativa D."}],THEORY=[{"title": "2. Reconhecimento: quando registrar?", "text": "O bem precisa representar benefícios econômicos para a entidade e ter custo mensurável com confiabilidade. A posse física e o pagamento, isoladamente, não resolvem a classificação.", "tag": "CRITÉRIOS DE RECONHECIMENTO"}, {"title": "Contrato, pagamento, entrega e uso", "text": "Exemplo: contrato em janeiro, pagamento em fevereiro, entrega e instalação em março, uso efetivo em abril. No cenário da questão 8, o equipamento entra no imobilizado em março. Antes da entrega, um pagamento pode representar adiantamento.", "tag": "QUANDO REGISTRAR"}, {"title": "Bens de segurança", "text": "Bens de segurança podem viabilizar a continuidade das operações. Grades, equipamentos ambientais e sistemas de proteção não precisam gerar receita diretamente para ter utilidade econômica.", "tag": "BENEFÍCIOS INDIRETOS"}, {"title": "Imobilizado em andamento", "text": "Obras e bens destinados à construção do próprio escritório podem integrar o imobilizado em andamento. Não confunda um bem em construção com material adquirido para revenda.", "tag": "OBRA PRÓPRIA"}, {"title": "Arrendamentos e isenções", "text": "Um ativo alugado não é automaticamente propriedade da entidade. Contratos de arrendamento precisam ser examinados conforme o CPC 06, inclusive suas isenções.", "tag": "ATENÇÃO AO CONTRATO"}, {"title": "Vamos praticar", "text": "Responda às questões 8, 9, 10, 11 e 12 da apostila. Selecione uma alternativa e confirme. A resolução aparecerá em uma tela separada.", "tag": "CINCO QUESTÕES FGV"}],KEY='moreira-cpc27-parte2-v1';let state={name:'',unlocked:false,index:0,answers:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let chosen=null;
const app=document.getElementById('app'),nav=document.getElementById('nav');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function wa(text){return 'https://wa.me/5561985323574?text='+encodeURIComponent(text)}
function cover(){nav.hidden=true;nav.style.display='none';app.innerHTML=`<div class="tag">CPC 27 • ESTUDO E TREINAMENTO</div><h1>Ativo Imobilizado<br>Parte 2</h1><h2>Professor Moreira</h2><div class="note">Reconhecimento: quando registrar?<br>Teoria + questões 8 a 12.</div><section class="card"><label for="name">Nome do aluno</label><input id="name" autocomplete="name" value="${esc(state.name)}" placeholder="Digite seu nome"><button class="btn green" id="request">📲 Solicitar liberação pelo WhatsApp</button><p class="meta">Informe seu nome e solicite a liberação pelo WhatsApp. Depois de enviar a mensagem, volte a esta página e toque em acessar. Não é necessário digitar senha.</p><button class="btn" id="enter" ${state.requested?'':'disabled'}>Acessar o material</button><div id="error" class="error" role="alert"></div></section><footer>Curso de Contabilidade Professor Moreira<br>Quem quer ser aprovado estuda.</footer>`;document.getElementById('request').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n){document.getElementById('error').textContent='Informe seu nome para solicitar acesso.';return}state.name=n;state.requested=true;save();document.getElementById('enter').disabled=false;window.open(wa('Olá, Professor Moreira! Sou '+n+'. Gostaria da liberação do HTML Ativo Imobilizado — Parte 2.'),'_blank','noopener')};document.getElementById('enter').onclick=()=>{let n=document.getElementById('name').value.trim();if(!n){document.getElementById('error').textContent='Informe seu nome.';return}state.name=n;state.unlocked=true;save();render()}}
const total=THEORY.length+QUESTIONS.length*2+1;function render(){if(!state.unlocked){cover();return}state.index=Math.max(0,Math.min(total-1,state.index));chosen=null;nav.hidden=false;nav.style.display='flex';let i=state.index;app.innerHTML=`<header><span class="tag">Professor Moreira • Parte 2</span><span class="meta">${i+1}/${total}</span></header><progress max="${total}" value="${i+1}"></progress>`;let canNext=true;if(i<THEORY.length){let t=THEORY[i];app.innerHTML+=`<section class="card"><span class="tag">${esc(t.tag)}</span><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p></section>`}else if(i<total-1){let off=i-THEORY.length,q=QUESTIONS[Math.floor(off/2)],a=state.answers[q.n];if(off%2===0){canNext=!!a;app.innerHTML+=`<section class="card"><span class="tag">TREINAMENTO</span><h2>Questão ${q.n}</h2><p class="meta">${esc(q.header)}</p><div class="text">${esc(q.body)}</div><div id="opts">${q.options.map(o=>`<button class="option ${a&&a.choice===o.letter?'selected':''}" data-choice="${o.letter}" aria-pressed="${!!(a&&a.choice===o.letter)}" ${a?'disabled':''}><b>${o.letter})</b> ${esc(o.text)}</button>`).join('')}</div>${a?'<p class="note">Resposta registrada. Avance para ver a resolução.</p>':'<button class="btn green" id="confirm" disabled>Confirmar resposta</button>'}</section>`;if(!a){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});document.getElementById('confirm').disabled=false});document.getElementById('confirm').onclick=()=>{if(!chosen)return;state.answers[q.n]={choice:chosen,correct:chosen===q.answer};state.index++;save();render();window.scrollTo(0,0)}}}else{app.innerHTML+=`<section class="card"><span class="tag">CONFERÊNCIA</span><h2>Resolução ${q.n}</h2>${a?`<div class="feedback ${a.correct?'correct':'wrong'}" role="status">${a.correct?'✅ Você acertou!':'❌ Você errou.'} Sua resposta: ${a.choice}.</div>`:''}<p class="note"><b>Gabarito: ${q.answer}</b></p><div class="text">${esc(q.resolution)}</div></section>`}}else{let answered=Object.keys(state.answers).length,right=Object.values(state.answers).filter(a=>a.correct).length;app.innerHTML+=`<section class="card"><span class="tag">TREINAMENTO CONCLUÍDO</span><h2>Resultado de ${esc(state.name)}</h2><p>Respondidas: <b>${answered}/${QUESTIONS.length}</b><br>Acertos: <b>${right}/${QUESTIONS.length}</b></p><a class="btn green" target="_blank" rel="noopener" href="${wa('Professor Moreira, sou '+state.name+'. Resultado em Ativo Imobilizado — Parte 2: '+right+' acertos em '+QUESTIONS.length+' questões.')}" >📲 Enviar resultado ao Professor</a><button class="btn" id="again">Refazer o treinamento</button></section>`;document.getElementById('again').onclick=()=>{if(confirm('Apagar suas respostas e reiniciar?')){state.answers={};state.index=0;save();render()}}}nav.innerHTML=`<button id="back" ${i===0?'disabled':''} aria-label="Voltar">←</button><button id="home">Capa</button><button id="next" ${i===total-1||!canNext?'disabled':''} aria-label="Avançar">→</button>`;document.getElementById('back').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('home').onclick=cover;save()}
function go(delta){state.index+=delta;save();render();window.scrollTo(0,0)}render();
</script></body></html>
